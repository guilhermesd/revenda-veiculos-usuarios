services:
  api-usuarios:
    build: .
    ports: ["8081:8080"]
    environment:
      ConnectionStrings__Mongo: mongodb://mongo-usuarios:27017
      Mongo__DatabaseName: revenda_usuarios
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      mongo-usuarios:
        condition: service_healthy

  mongo-usuarios:
    image: mongo:8.0
    volumes: ["mongo-usuarios-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo-usuarios-data:
